<!-- The backdrop click is the mouse shortcut; keyboard users close with Esc (cancel) or the ✕ button. -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog
  #dialog
  class="lb"
  [attr.aria-label]="lightbox.image()?.alt"
  (click)="backdropClick($event)"
  (cancel)="cancel($event)"
>
  @let img = lightbox.image();
  <figure class="lb-panel" [class.lb-phone]="img?.kind === 'phone'">
    <div class="lb-top">
      <figcaption>{{ img?.alt }}</figcaption>
      <button #closeBtn type="button" class="lb-x" aria-label="Close the picture" (click)="lightbox.close()">
        <svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
    </div>
    <div class="lb-scroll">
      @if (img) {
        @for (src of [img.src]; track src) {
          <img [ngSrc]="src" [width]="img.width" [height]="img.height" [alt]="img.alt" decoding="async" />
        }
      }
    </div>
  </figure>
</dialog>
