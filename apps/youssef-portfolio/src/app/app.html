<div
  class="root"
  [attr.data-theme]="theme.theme()"
  [class.motion-on]="motion.on()"
  [class.motion-off]="!motion.on()"
  [class.reveal-on]="reveal.ready()"
>
  <div class="cq">
    <app-header />
    <main>
      <app-hero />
      @defer (hydrate on viewport) {
        <app-what-i-do />
      }
      @defer (hydrate on viewport) {
        <app-work />
      }
      @defer (hydrate on viewport) {
        <app-experience />
      }
    </main>
  </div>
</div>
