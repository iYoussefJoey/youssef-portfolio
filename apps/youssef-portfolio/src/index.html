    <!-- Lexend 300–800 for all text, Geist Mono 400/500 for code and labels. Self-hosted and preloaded so they
         arrive before the first layout (each late font swap re-lays out the whole page). See public/fonts/README.md. -->
    <link rel="preload" href="fonts/lexend-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Lexend';
        font-style: normal;
        font-weight: 300 800;
        font-display: swap;
        src: url(fonts/lexend-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
          U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Geist Mono';
        font-style: normal;
        font-weight: 400 500;
        font-display: swap;
        src: url(fonts/geist-mono-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
          U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
    <!-- Before the first paint: apply the saved or OS theme (no light flash for dark-mode visitors), and with Motion
         allowed open the hero on the UX view, as the app would, so nothing jumps when Angular takes over. -->
    <script>
      (function () {
        var root = document.querySelector('.root');
        if (!root) return;
        var mm = function (q) {
          return !!(window.matchMedia && matchMedia(q).matches);
        };
        var t = null;
        try {
          t = localStorage.getItem('jf-theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = mm('(prefers-color-scheme: dark)') ? 'dark' : 'light';
        root.setAttribute('data-theme', t);

        var hero = document.getElementById('top');
        if (!hero || mm('(prefers-reduced-motion: reduce)')) return;
        hero.classList.remove('lens-ui');
        hero.classList.add('lens-ux');
        var seg = hero.querySelectorAll('.seg button');
        for (var i = 0; i < seg.length; i++) {
          seg[i].classList.toggle('on', i === 0);
          seg[i].setAttribute('aria-pressed', String(i === 0));
        }
        var hint = hero.querySelector('.lens-hint');
        if (hint && hint.firstChild) hint.firstChild.nodeValue = hint.getAttribute('data-ux-hint');
      })();
    </script>
  </body>
</html>
