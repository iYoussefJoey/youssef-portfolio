# Build the Angular app (prerendered to static HTML) and publish it to GitHub Pages on every push to master.
# Site URL: https://iyoussefjoey.github.io/youssef-portfolio/
# Custom domain later: add public/CNAME and change BASE_HREF to "/".
name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BASE_HREF: /youssef-portfolio/
  OUT: dist/apps/youssef-portfolio/browser

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Same Node (and npm 11) as local development, so package-lock.json is read the way it was written.
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and prerender
        # Project Pages need the repo name as base href so assets resolve.
        run: npx nx build youssef-portfolio --configuration=production --base-href=$BASE_HREF

      - name: Check both pages were prerendered
        run: |
          grep -q 'Youssef Khamis' "$OUT/index.html"
          grep -q 'lang="ar" dir="rtl"' "$OUT/ar/index.html"

      - name: 404 page
        # GitHub Pages serves 404.html for unknown paths (old links like /experience); it is the same page.
        run: cp "$OUT/index.html" "$OUT/404.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
