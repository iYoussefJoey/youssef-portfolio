<aside class="intro-aside__rail">
  <nav class="intro-aside__nav" aria-label="On this page">
    @for (section of sections(); track section.id) {
    <a
      class="intro-aside__link"
      [class.intro-aside__link--active]="scrollSpy.isActive(section.id)"
      [href]="'#' + section.id"
      (click)="onNavClick(section.id, $event)"
    >
      <span class="intro-aside__link-bar" aria-hidden="true"></span>
      <span class="intro-aside__link-label">{{ section.label }}</span>
    </a>
    }
  </nav>

  <ul class="intro-aside__socials" aria-label="Social links">
    @for (social of socials(); track social.id) {
    <li>
      <a
        class="intro-aside__social"
        [href]="social.href"
        [matTooltip]="social.label"
        [attr.aria-label]="social.label"
        target="_blank"
        rel="noopener noreferrer"
      >
        <ng-icon class="intro-aside__social-icon" [name]="social.icon" />
      </a>
    </li>
    }
  </ul>
</aside>
