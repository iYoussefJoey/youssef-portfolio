<header class="header">
  <mat-toolbar class="header__bar">
    @if (showBack()) {
    <a
      class="header__back"
      href="/"
      aria-label="Back to home"
      [class.header__back--leaving]="isBacking()"
      (click)="onBackClick($event)"
    >
      <mat-icon class="header__back-icon" aria-hidden="true"
        >arrow_back</mat-icon
      >
      <span class="header__back-label">Back</span>
    </a>
    }

    <a class="header__brand" routerLink="/" aria-label="Youssef Khamis">
      <span class="header__name header__name--left">Youssef</span>
      <span class="header__yk animate-yk-expand" aria-hidden="true">
        <svg
          class="header__yk-svg animate-yk-color"
          viewBox="0 0 48 32"
          width="1.85em"
          height="1.15em"
          fill="none"
        >
          <!-- Handwritten Y: left arm → crotch → stem, then right arm -->
          <path
            class="header__yk-path animate-yk-draw-y"
            pathLength="1"
            d="M5 4 C10 11 12 15 14 18 L14 28 M24 4 C18 11 15 15 14 18"
          />
          <!-- Handwritten K: stem, then upper & lower arms from the join -->
          <path
            class="header__yk-path animate-yk-draw-k"
            pathLength="1"
            d="M31 3 L31 29 M31 16 C35 11 39 7 44 4 M31 16 C36 20 40 24 45 29"
          />
        </svg>
      </span>
      <span class="header__name header__name--right">Khamis</span>
    </a>

    <!-- Desktop Josh-style tabs -->
    <nav class="header__nav" aria-label="Primary">
      @for (link of navLinks; track link.path) {
      <a
        class="header__nav-link"
        [routerLink]="link.path"
        routerLinkActive="header__nav-link--active"
        >{{ link.label }}</a
      >
      }
    </nav>

    <span class="header__spacer"></span>

    <!-- Right utilities: same row height so icons align -->
    <div class="header__actions">
      <button
        matIconButton
        type="button"
        class="header__menu-btn"
        [attr.aria-expanded]="mobileNavOpen()"
        [attr.aria-label]="mobileNavOpen() ? 'Close menu' : 'Open menu'"
        (click)="toggleMobileNav()"
      >
        <mat-icon
          class="header__menu-icon"
          [class.header__menu-icon--open]="mobileNavOpen()"
          >{{ mobileNavOpen() ? 'close' : 'menu' }}</mat-icon
        >
      </button>

      <button
        matIconButton
        type="button"
        aria-label="Toggle theme"
        [matMenuTriggerFor]="menu"
      >
        <mat-icon class="header__theme-toggle">contrast</mat-icon>
      </button>
    </div>

    <mat-menu #menu="matMenu">
      @for (item of themeMenuItems; track item.preference) {
      <button
        mat-menu-item
        class="header__theme-item"
        (click)="systemTheme.setPreference(item.preference)"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </button>
      }
    </mat-menu>
  </mat-toolbar>

  <nav
    class="header__mobile"
    [class.header__mobile--open]="mobileNavOpen()"
    aria-label="Mobile primary"
    [attr.inert]="mobileNavOpen() ? null : ''"
  >
    @for (link of navLinks; track link.path) {
    <a
      class="header__mobile-link"
      [routerLink]="link.path"
      routerLinkActive="header__mobile-link--active"
      (click)="closeMobileNav()"
      >{{ link.label }}</a
    >
    }
  </nav>
</header>
